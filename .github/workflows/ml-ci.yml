name: ML Drift Monitoring CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with Ruff
        run: ruff check dews/ backend/ tests/ --output-format=github

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

  benchmark-gate:
    name: Benchmark Drift Detection Gate
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run benchmark suite
        id: benchmark
        run: |
          python main.py --benchmark --output benchmark_results.json --no-mlflow
          cat benchmark_results.json

      - name: Validate benchmark thresholds
        run: |
          python -c "
          import json, sys

          with open('benchmark_results.json') as f:
              data = json.load(f)

          report = data.get('report', data)

          # Gate 1: Drift detection lag must be <= 3 batches
          drift_lag = report.get('drift_lag')
          if drift_lag is not None and drift_lag > 3:
              print(f'FAIL: drift_lag={drift_lag} exceeds threshold of 3 batches')
              sys.exit(1)
          print(f'PASS: drift_lag={drift_lag}')

          # Gate 2: Must generate at least 1 alert
          alerts = report.get('alerts_generated', 0)
          if alerts < 1:
              print(f'FAIL: alerts_generated={alerts}, expected at least 1')
              sys.exit(1)
          print(f'PASS: alerts_generated={alerts}')

          # Gate 3: Average accuracy must be >= 0.5
          accuracy = report.get('average_accuracy')
          if accuracy is not None and accuracy < 0.5:
              print(f'FAIL: average_accuracy={accuracy} below 0.5')
              sys.exit(1)
          print(f'PASS: average_accuracy={accuracy}')

          print('All benchmark gates passed!')
          "

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.json
